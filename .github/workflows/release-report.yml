name: Build release report

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season to include in the report"
        required: true
        default: "2023"

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build release artifacts
        run: python scripts/build_release.py --download --year "${{ inputs.year }}" --full-audit

      - name: Validate release artifacts
        run: python scripts/check_release.py --year "${{ inputs.year }}"

      - name: Upload report bundle
        uses: actions/upload-artifact@v4
        with:
          name: f1-championship-report-${{ inputs.year }}
          path: results/
